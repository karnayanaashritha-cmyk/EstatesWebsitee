  <path d="M42 22C42 20.3431 43.3431 19 45 19H55C56.6569 19 58 20.3431 58 22V82H42V22Z" fill="url(#mp-grad)" />
  <!-- Spire -->
  <rect x="49" y="12" width="2" height="7" fill="#f43f5e" rx="1" />
