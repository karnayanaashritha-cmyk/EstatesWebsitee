      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="mp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  
  <!-- Architectural Skyline / Modern Towers -->
  <!-- Left lower building -->
  <rect x="22" y="46" width="16" height="36" rx="3" fill="#334155" />
  <rect x="26" y="52" width="3" height="4" rx="0.5" fill="#94a3b8" />
  <rect x="31" y="52" width="3" height="4" rx="0.5" fill="#94a3b8" />
  <rect x="26" y="60" width="3" height="4" rx="0.5" fill="#94a3b8" />
  <rect x="31" y="60" width="3" height="4" rx="0.5" fill="#94a3b8" />
  <rect x="26" y="68" width="3" height="4" rx="0.5" fill="#94a3b8" />
  <rect x="31" y="68" width="3" height="4" rx="0.5" fill="#94a3b8" />

