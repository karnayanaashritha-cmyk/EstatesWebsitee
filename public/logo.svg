  <rect x="46" y="26" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="51" y="26" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="46" y="35" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="51" y="35" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="46" y="44" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="51" y="44" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="46" y="53" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="51" y="53" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="46" y="62" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  <rect x="51" y="62" width="3.5" height="5" rx="0.8" fill="#ffffff" opacity="0.9" />
  
  <!-- Right building with sloped penthouse -->
  <path d="M62 38L74 46V82H62V38Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <rect x="66" y="52" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.85" />
  <rect x="66" y="60" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.85" />
  <rect x="66" y="68" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.85" />

  <!-- Base baseline ground line -->
  <line x1="16" y1="82" x2="84" y2="82" stroke="#e11d48" stroke-width="3" stroke-linecap="round" />
